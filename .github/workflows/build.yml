name: Build OpenWrt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OpenWrt
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Apply local OpenWrt patch
        working-directory: openwrt
        run: |
          PATCH=../patches/openwrt/0001-mediatek-add-gl-mt3600be-support.patch
          git apply "$PATCH"
          cp -r ../files .

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure GL-MT3600BE build
        working-directory: openwrt
        run: |
          cp ../configs/mt3600be .config
          make defconfig
          ./scripts/diffconfig.sh | tee diffconfig.txt

      - name: Copy custom files
        working-directory: openwrt
        run: |
          cp -r ../files .

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" download clean world

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmwares
          path: |
            openwrt/bin/targets/mediatek/filogic/**
